<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estoque - Copilot de Compras</title>
  <link rel="stylesheet" href="estilo.css">
  <script type="module" src="estoque.js"></script>
</head>
<body>
  <header>
    <div class="conteudo">
      <strong class="marca">Copilot de Compras</strong>
      <nav aria-label="Telas do Copilot"></nav>
      <button id="abrir-chat" type="button" class="abrir-chat" aria-expanded="false" aria-controls="chat-lateral">Perguntar ao Copilot</button>
    </div>
  </header>
  <main class="conteudo">
    <div class="cabecalho-pagina">
      <div>
        <h1>Estoque</h1>
        <p class="suave">Todos os SKUs ativos: o que tem, o que está a caminho e quantos dias o estoque segura.</p>
      </div>
    </div>
    <form id="filtros" class="filtros filtros-estoque" role="search" aria-label="Buscar e filtrar o estoque" hidden>
      <input id="filtro-busca" name="busca" type="search" autocomplete="off" enterkeyhint="search" maxlength="100" placeholder="Buscar código, nome, cor, tamanho" aria-label="Buscar por código, nome, cor ou tamanho">
      <select id="filtro-categoria" name="categoria" aria-label="Categoria"><option value="">Todas as categorias</option></select>
      <select id="filtro-situacao" name="situacao" aria-label="Situação"><option value="">Todas as situações</option></select>
      <button id="limpar-filtros" class="limpar-filtros" type="button" hidden>Limpar filtros</button>
    </form>
    <div class="barra-estoque" hidden>
      <p id="total" class="suave" aria-live="polite"></p>
      <label class="ordem">Ordenar por
        <select id="ordem" name="ordem"></select>
      </label>
    </div>
    <p id="carregando" class="carregando">Lendo o estoque...</p>
    <div id="estoque"></div>
  </main>
</body>
</html>
