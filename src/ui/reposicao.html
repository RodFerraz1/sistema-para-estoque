<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel do repositor - Integração - Bandfashion</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="estilo.css">
  <script type="module" src="reposicao.js"></script>
</head>
<body>
  <header>
    <div class="conteudo estreito">
      <strong class="marca">Integração - Bandfashion</strong>
      <nav aria-label="Telas do Copilot"></nav>
    </div>
  </header>
  <main class="conteudo estreito">
    <h1>Painel do repositor</h1>

    <p id="carregando" class="carregando">Carregando...</p>
    <div id="painel"></div>
  </main>

  <dialog id="confirmar-acao" class="confirmacao" aria-labelledby="t-confirmar-acao">
    <form method="dialog">
      <h2 id="t-confirmar-acao"></h2>
      <p id="acao-a-confirmar"></p>
      <div class="confirmacao-botoes">
        <button value="cancelar" autofocus>Cancelar</button>
        <button value="confirmar" class="primario">Confirmar</button>
      </div>
    </form>
  </dialog>
</body>
</html>
