<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel de alertas - Copilot de Compras</title>
  <link rel="stylesheet" href="estilo.css">
  <script type="module" src="painel.js"></script>
</head>
<body>
  <header>
    <div class="conteudo">
      <strong class="marca">Copilot de Compras</strong>
      <nav aria-label="Telas do Copilot"></nav>
      <button id="abrir-chat" type="button" class="abrir-chat" aria-expanded="false" aria-controls="chat-lateral">Perguntar ao Copilot</button>
    </div>
  </header>
  <main class="conteudo">
    <div class="cabecalho-pagina">
      <div>
        <h1 id="saudacao">Painel de alertas</h1>
        <p class="suave">O que pede a sua atenção agora, calculado na hora com a política de compra.</p>
      </div>
      <div class="acoes">
        <a id="link-aviso" class="botao" href="aviso.html" target="_blank" rel="noopener" data-papel="vendas" hidden>Página das vendedoras ↗</a>
      </div>
    </div>
    <form id="filtros" class="filtros" role="search" aria-label="Buscar e filtrar o painel" hidden>
      <input id="filtro-busca" name="busca" type="search" autocomplete="off" enterkeyhint="search" maxlength="100" placeholder="Buscar código, nome, cor, tamanho" aria-label="Buscar por código, nome, cor ou tamanho">
      <select id="filtro-categoria" name="categoria" aria-label="Categoria"><option value="">Todas as categorias</option></select>
      <select id="filtro-motivo" name="motivo" aria-label="Motivo"><option value="">Todos os motivos</option></select>
      <select id="filtro-fornecedor" name="fornecedor" aria-label="Fornecedor"><option value="">Todos os fornecedores</option></select>
      <button id="limpar-filtros" type="button" hidden>Limpar filtros</button>
    </form>
    <p id="carregando" class="carregando">Calculando o painel...</p>
    <div id="painel"></div>
  </main>
</body>
</html>
