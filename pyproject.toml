[project]
name = "copilot-compras"
version = "0.1.0"
description = "Copilot de Compras: assistente de decisão de compras para atacadista de cama, mesa e banho."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "typesafe-sdk>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "smoke: end-to-end tests that require Postgres + seed (docker compose up + alembic upgrade head)",
]

[tool.uv]
package = true
